# Kinetic Leisure scenario controller: Kubernetes manifest.
#
# Mirrors the objects running in the demo cluster (Deployment, Service, and a
# Cilium Gateway API Gateway + HTTPRoute), with cluster-generated fields
# (status, uid, resourceVersion, clusterIP, LoadBalancer address) removed.
#
# There is NO Secret and NO env block: the HEC URL / token / index are entered
# in the control-panel UI and persisted by the app to /app/config.json inside
# the container (see README, "HEC configuration"). Never put a real token in
# this file.
#
# Prerequisites:
#   - Namespace `net-triage-agent` already exists (it is shared with the
#     triage agent). Create it first if you are deploying standalone:
#       kubectl create namespace net-triage-agent
#   - A container registry reachable at localhost:5000 (see README), or edit
#     `image:` below.
#   - Gateway API CRDs + a GatewayClass named `cilium`. If you use a different
#     ingress mechanism, drop the Gateway/HTTPRoute and use the commented
#     Ingress alternative at the bottom, or `kubectl port-forward`.
#
# Apply with:  kubectl apply -f k8s-manifest.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kl-scenario-controller
  namespace: net-triage-agent
  labels:
    app: kl-scenario-controller
    component: data-generation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kl-scenario-controller
  template:
    metadata:
      labels:
        app: kl-scenario-controller
        component: data-generation
    spec:
      containers:
        - name: scenario-controller
          image: localhost:5000/kl-scenario-controller:latest
          # :latest + Always means a `rollout restart` picks up a freshly
          # pushed image.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kl-scenario-controller
  namespace: net-triage-agent
spec:
  type: ClusterIP
  selector:
    app: kl-scenario-controller
  ports:
    - port: 80
      targetPort: 8080
---
# Cilium Gateway API entry point (HTTP :80). In the demo cluster the Gateway is
# given a LoadBalancer address by the cluster; that address is assigned at
# runtime, is not part of the spec, and is intentionally not recorded here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scenario-controller-gateway
  namespace: net-triage-agent
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# Routes every path on the Gateway to the Service. No `hostnames` are set, so
# the route matches any Host header: reach it by the Gateway's address.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scenario-controller-httproute
  namespace: net-triage-agent
spec:
  parentRefs:
    - name: scenario-controller-gateway
      sectionName: http
  rules:
    - backendRefs:
        - name: kl-scenario-controller
          port: 80
# ---------------------------------------------------------------------------
